name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:model:test :core:engine:test

  android-build:
    needs: jvm-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: merged-manifest
          path: app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          if-no-files-found: error

  permissions-audit:
    needs: android-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: merged-manifest
          path: app/build/intermediates/merged_manifests/debug/processDebugManifest
      - run: bash scripts/check-manifest-permissions.sh

  engine-purity:
    needs: permissions-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -rn "import android" core/; then
            echo "ERROR: Android import found in core/"
            exit 1
          fi
          exit 0
